name: security

# Quand lancer le workflow
on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux du jeton GitHub : lecture seule du code
permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04        # version épinglée plutôt que ubuntu-latest
    steps:
      # 1. Récupérer le code. Le runner est vide au départ.
      - name: Checkout avec tout l'historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0         # par défaut, seul le dernier commit est récupéré
          persist-credentials: false   # ne pas laisser le jeton dans .git/config

      # 2. Ta commande locale, adaptée au runner
      - name: Scanner l'historique avec gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --verbose --redact --gitleaks-ignore-path /repo/.gitleaksignore
  
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pas de fetch-depth : le SAST analyse le code actuel, pas l'historique

      - name: Scanner le code avec Semgrep
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.181.0-nonroot@sha256:4c37ae86cb02b5536f8c9ff6aabbc991944117e4678609e14e0f19a2bd7ea879 \
            semgrep scan --config p/python \
            --config r/python.lang.security.audit.formatted-sql-query.formatted-sql-query \
            --metrics=off --json-output=/src/semgrep.json

      - name: Appliquer la politique de blocage (ERROR + règles choisies)
        run: |
          BLOQUANTS=$(jq '[.results[]
            | select(.extra.severity == "ERROR"
                  or .check_id == "python.lang.security.audit.formatted-sql-query.formatted-sql-query")]
            | length' semgrep.json)
          echo "Résultats bloquants : $BLOQUANTS"
          test "$BLOQUANTS" -eq 0
  
  sca:
    name: SCA (Trivy fs)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyser les dépendances avec Trivy fs
        # :ro pour read only, trivy n'a pas besoin d'écrire dans le dossier du projet
        run: |
          docker run --rm -v "${{ github.workspace }}:/project:ro" \
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /project
  
  dockerfile:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyser le Dockerfile avec Hadolint
        run: |
          docker run --rm -v "${{ github.workspace }}:/work:ro" \
            hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 \
            hadolint --config /work/.hadolint.yml /work/Dockerfile
  
  image:
    name: Scan image (Trivy image)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l'image
        run: docker build -t devsecops-mini:${{ github.sha }} .

      - name: Scanner l'image avec Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            devsecops-mini:${{ github.sha }}